# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS — editor de juegos.
# Local (Chrome): npm run dev → /admin/ → "Work with Local Repository"
#   y elige la raíz del repo. No usa decap-server.
# Producción: GitHub OAuth vía /api/auth + /api/callback (funciones Vercel).
#
# keyword = nombre del archivo = slug de URL (/juegos/<keyword>/).
# Una sola palabra ASCII en minúsculas. El href no se edita: se deriva.

backend:
  name: github
  repo: ratolibre1/estudio-alpargatas
  branch: main
  base_url: https://estudio-alpargatas.vercel.app/api

media_folder: public/assets
public_folder: /assets

collections:
  - name: games
    label: Juegos
    label_singular: Juego
    folder: src/content/games
    create: true
    delete: false
    slug: '{{keyword}}'
    extension: md
    format: frontmatter
    identifier_field: keyword
    summary: '{{emoji}} {{keyword}} — {{name}}'
    fields:
      - label: Keyword
        name: keyword
        widget: string
        hint: 'Una palabra en minúsculas, sin tildes. Es el id y la URL: /juegos/<keyword>/. Ej: reloj, canes, mantas.'
        pattern: ['^[a-z][a-z0-9]*$', 'Solo letras minúsculas ASCII, una palabra (ej: canes).']
      - { label: Nombre, name: name, widget: string, hint: 'Nombre visible. Puede ser largo (Hasta un Reloj Roto…).' }
      - { label: Emoji, name: emoji, widget: string }
      - { label: Tagline, name: tagline, widget: string }
      - { label: Descripción (home), name: description, widget: text, required: false, hint: 'Si está vacío, la home usa el tagline.' }
      - { label: Meta (género · versión), name: meta, widget: string }
      - label: Estado
        name: state
        widget: select
        options:
          - { label: 'Publicado — en el mercado', value: publicado }
          - { label: 'En producción — reglas cerradas, camino a editorial', value: produccion }
          - { label: 'Disponible — prototipo jugable estable', value: disponible }
          - { label: 'En pruebas — motor en testeo activo', value: pruebas }
          - { label: 'Boceto — idea o proto muy temprano', value: boceto }
          - { label: 'Idea — concepto muy temprano o abstracto', value: idea }
      - label: Etiqueta del estado (ES)
        name: stateLabel
        widget: select
        options:
          - { label: Publicado, value: Publicado }
          - { label: En producción, value: En producción }
          - { label: Disponible, value: Disponible }
          - { label: En pruebas, value: En pruebas }
          - { label: Boceto, value: Boceto }
          - { label: Idea, value: Idea }
      - label: Etiqueta del estado (EN)
        name: stateLabelEn
        widget: select
        required: false
        options:
          - { label: Published, value: Published }
          - { label: In production, value: In production }
          - { label: Available, value: Available }
          - { label: In testing, value: In testing }
          - { label: Sketch, value: Sketch }
          - { label: Idea, value: Idea }
      - { label: Orden, name: stateOrder, widget: number, value_type: int, min: 1, max: 6, hint: '1=publicado · 2=produccion · 3=disponible · 4=pruebas · 5=boceto · 6=idea' }
      - { label: Fecha (YYYY-MM), name: date, widget: string, pattern: ['^\d{4}-\d{2}$', 'Usa formato YYYY-MM'] }
      - label: Sección en la home
        name: home
        widget: select
        default: none
        options:
          - { label: Destacado (catálogo), value: featured }
          - { label: Taller (prototipos), value: proto }
          - { label: Solo portafolio, value: none }
      - { label: Orden en la home, name: homeOrder, widget: number, value_type: int, required: false, hint: '1, 2, 3… dentro de la sección. 0 si no va en home.' }
      - { label: Jugadores, name: players, widget: string, required: false, hint: 'Ej: 2–4' }
      - { label: Duración, name: duration, widget: string, required: false, hint: 'Ej: 20–30 min' }
      - label: Facts (home destacados)
        name: facts
        widget: list
        required: false
        field: { label: Fact, name: fact, widget: string }
      - { label: Imagen (home), name: image, widget: string, required: false, hint: '/assets/archivo.webp' }
      - { label: Alt de la imagen, name: imageAlt, widget: string, required: false }
      - label: Fotos de playtest
        name: fotos
        widget: list
        required: false
        hint: 'Galería de mesa en la ficha stub. No se usa en la home.'
        fields:
          - { label: Archivo, name: src, widget: string, hint: '/assets/archivo.webp' }
          - { label: Alt, name: alt, widget: string }
          - { label: Pie, name: caption, widget: string, required: false }
      - { label: Cover número, name: coverNumber, widget: string, required: false, hint: 'JUEGO 02' }
      - { label: Cover título, name: coverTitle, widget: text, required: false, hint: 'Puede ir en dos líneas.' }
      - { label: Cover status, name: coverStatus, widget: string, required: false }
      - label: Cover theme
        name: coverTheme
        widget: select
        required: false
        options:
          - { label: Rojo, value: red }
          - { label: Verde, value: green }
          - { label: Azul, value: blue }
      - { label: Iniciales (taller), name: coverInitials, widget: string, required: false, hint: 'FC, PI, PV, TT' }
      - { label: BGG ID, name: bggId, widget: number, value_type: int, required: false, hint: 'Número de boardgamegeek.com/boardgame/XXXXX. Nínive es 456259.' }
      - label: Premios
        name: awards
        widget: list
        required: false
        hint: 'Imagen del premio + subtítulo. El link es opcional.'
        fields:
          - { label: Título, name: title, widget: string }
          - { label: Imagen, name: image, widget: image, required: false }
          - { label: Link, name: href, widget: string, required: false }
      - { label: Color de fondo, name: bg, widget: string }
      - { label: Color del título, name: titleColor, widget: string }
      - { label: Color del tagline, name: taglineColor, widget: string }
      - label: Paleta (4 colores)
        name: palette
        widget: list
        min: 4
        max: 4
        hint: 'Orden: base clara, principal, contrapunto, tinta oscura. El modo de ficha se elige por separado.'
        field: { label: Color, name: color, widget: string }
      - label: Modo de la ficha
        name: fichaMode
        widget: select
        default: light
        hint: 'Elección explícita por juego. El botón de debug permite comparar sin modificar este valor.'
        options:
          - { label: Claro, value: light }
          - { label: Oscuro, value: dark }
      - { label: Fuente CSS del título, name: titleFont, widget: string, hint: 'Google Font + fallback, ej. "Cinzel, serif". Si es una familia nueva, sumarla a src/lib/caja-fonts.ts' }
      - { label: Fuente CSS del subtítulo, name: taglineFont, widget: string, hint: 'Google Font del tagline. Misma regla: si es nueva, caja-fonts.ts' }
      - { label: Fuente cuerpo (secciones), name: bodyFont, widget: string, required: false, hint: 'UI y párrafos. Si vacío: taglineFont o sans.' }
      - { label: Color texto cuerpo, name: bodyColor, widget: string, required: false, hint: 'Párrafos y UI. Si vacío: color del título.' }
      - { label: Color texto secundario, name: mutedColor, widget: string, required: false }
      - { label: Color bordes, name: lineColor, widget: string, required: false }
      - { label: Color superficie (cards), name: surfaceColor, widget: string, required: false, hint: 'Fondo de paneles; default paleta[4] o blanco.' }
      - { label: Color CTA, name: ctaColor, widget: string, required: false, hint: 'Botón principal; default paleta.' }
      - { label: Header fondo, name: headerBg, widget: string, required: false }
      - { label: Header texto, name: headerText, widget: string, required: false }
      - { label: Header links, name: headerMuted, widget: string, required: false }
      - { label: Footer fondo, name: footerBg, widget: string, required: false }
      - { label: Footer texto, name: footerText, widget: string, required: false }
      - { label: Footer links, name: footerMuted, widget: string, required: false }
      - label: Conceptos (imagen)
        name: conceptos
        widget: list
        min: 3
        max: 3
        hint: 'Exactamente 3, en este orden: temática, estilo visual, mecánicas. Lo usa el agente de imágenes; no se muestra en la web.'
        field: { label: Concepto, name: concepto, widget: string }
      - { label: Pie de la imagen conceptual, name: imageCaption, widget: string, required: false }
      - { label: Título del pitch, name: pitchTitle, widget: string, required: false }
      - { label: Pitch, name: pitch, widget: text, required: false, hint: 'Párrafo de experiencia. Si está vacío, se usa description.' }
      - { label: URL de compra, name: buyUrl, widget: string, required: false, hint: 'Solo publicados. Ej: https://ludoismo.cl/' }
      - { label: CTA proto (opcional), name: ctaHref, widget: string, required: false, hint: 'Chat IG directo, ej. https://ig.me/m/estudioalpargatas/ — si vacío, usa ese enlace.' }
      - { label: URL de reglas, name: rulesUrl, widget: string, required: false }
      - { label: Etiqueta de reglas, name: rulesLabel, widget: string, required: false }
      - { label: URL editorial, name: publisherUrl, widget: string, required: false }
      - { label: Nombre editorial, name: publisherLabel, widget: string, required: false }
      - { label: Versión (proto), name: version, widget: string, required: false, hint: 'Ej: 0.4' }
      - { label: Qué se está ajustando, name: adjusting, widget: text, required: false }
      - { label: Próximas pruebas, name: nextPlaytests, widget: text, required: false }
      - label: Cómo se juega (máx. 3)
        name: howTo
        widget: list
        required: false
        fields:
          - { label: Título, name: title, widget: string }
          - { label: Texto, name: body, widget: text }
          - { label: Imagen, name: image, widget: string, required: false, hint: '/assets/archivo.webp' }
          - { label: Alt, name: imageAlt, widget: string, required: false }
      - { label: Foto de componentes, name: componentsPhoto, widget: string, required: false }
      - { label: Alt foto componentes, name: componentsPhotoAlt, widget: string, required: false }
      - { label: Nota de componentes, name: componentsNote, widget: string, required: false, hint: 'Ej: Materiales en revisión' }
      - label: Componentes
        name: components
        widget: list
        required: false
        fields:
          - { label: Cantidad, name: qty, widget: string }
          - { label: Nombre, name: name, widget: string }
          - label: Icono
            name: icon
            widget: select
            required: false
            hint: 'Slugs en src/lib/comp-icons.ts (COMP_ICON_LABELS). Vacío = fichas genéricas.'
            options:
              - { label: '— Default (fichas)', value: '' }
              - { label: Reglamento, value: rulebook }
              - { label: Mazo / cartas, value: deck-cards }
              - { label: Cartas en mano / rol, value: hand-cards }
              - { label: Dado D6, value: die-d6 }
              - { label: Dados poliédricos, value: dice-poly }
              - { label: Fichas / tokens, value: tokens-stack }
              - { label: Losetas, value: tiles-stack }
              - { label: Meeples, value: meeples }
              - { label: Peones, value: pawn }
              - { label: Miniaturas, value: miniature }
              - { label: Mapa, value: map }
              - { label: Tablero personal, value: player-board }
              - { label: Losetas hex, value: hex-tiles }
              - { label: Terreno / paisaje, value: terrain-tiles }
              - { label: Piezas especiales, value: puzzle }
              - { label: Monedas, value: coins }
              - { label: Cubos de recurso, value: resource-cubes }
              - { label: Cilindros, value: cylinders }
              - { label: Salvavidas / corazón, value: heart-star }
              - { label: Banderas, value: flags }
              - { label: Reloj / temporizador, value: hourglass }
              - { label: Bolsa de fichas, value: token-bag }
              - { label: Pantalla de jugador, value: player-screen }
              - { label: Ruleta / spinner, value: spinner }
              - { label: Bloc de puntuación, value: score-pad }
          - { label: Foto detalle, name: image, widget: string, required: false, hint: 'Hover/click en la ficha' }
          - { label: Alt foto detalle, name: imageAlt, widget: string, required: false }
      - label: Recursos (PDF, PnP)
        name: resources
        widget: list
        required: false
        fields:
          - { label: Etiqueta, name: label, widget: string }
          - { label: URL, name: href, widget: string }
          - { label: Meta, name: meta, widget: string, required: false, hint: 'Versión o idioma' }
      - { label: Créditos, name: credits, widget: string, required: false }
      - { label: Concepto / notas, name: body, widget: markdown, required: false, hint: 'Texto largo bajo el héroe. Codex también puede editarlo en el .md' }
